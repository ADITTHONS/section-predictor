kind = "web"
previewPath = "/"
title = "Section Predictor"
version = "1.0.0"
id = "artifacts/section-predictor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20202

[services.development]
run = "pnpm --filter @workspace/section-predictor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/section-predictor", "run", "build" ]
publicDir = "artifacts/section-predictor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20202"
BASE_PATH = "/"
